name: Deploy backend

# Builds the backend's Docker image with the model files inside and runs it on Azure App Service
# (D11, #126; steps in sproutly-backend/DEPLOY.md). It does nothing until the repository variable
# AZURE_WEBAPP_NAME is set, so merging this file deploys nothing by itself.
on:
  push:
    branches: [main]
    paths:
      - "sproutly-backend/**"
      - "ml/data/advice/advice.csv"
      - "ml/data/contacts/support_contacts.csv"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deployment at a time; a newer merge waits for the running one.
concurrency: deploy-backend

env:
  IMAGE: ghcr.io/billiartmuthoni/sproutly-backend

jobs:
  deploy:
    name: Build and deploy
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned model revision
        run: |
          REVISION="$(tr -d '[:space:]' < sproutly-backend/model_revision.txt)"
          if ! echo "$REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sproutly-backend/model_revision.txt must hold the 40-character commit of the Hugging Face model repo (see DEPLOY.md)." >&2
            exit 1
          fi
          echo "MODEL_REVISION=$REVISION" >> "$GITHUB_ENV"

      - name: Download the model files at that revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: |
          pip install --quiet "huggingface_hub>=0.24"
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['HF_MODEL_REPO'], revision=os.environ['MODEL_REVISION'], local_dir='sproutly-backend/models', token=os.environ['HF_TOKEN'], allow_patterns=['*/model.pt', 'leaf_check.json'])"
          # The backend's default settings expect exactly these files.
          for f in d17_resnet50_seed44/model.pt d22_convnext_tiny_lr1e-04/model.pt d22_efficientnet_b0/model.pt leaf_check.json; do
            test -s "sproutly-backend/models/$f" || { echo "Missing in the model repo: $f" >&2; exit 1; }
          done
          du -sh sproutly-backend/models

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (tagged with this commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sproutly-backend/Dockerfile
          push: true
          build-args: MODEL_REVISION=${{ env.MODEL_REVISION }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run this image on Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
